[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         tail
    Path         C:\logs\payment-service.log
    Tag          payment-service
    Read_from_Head true

[FILTER]
    Name         modify
    Match        payment-service
    Rename       log message
    Add          service_name payment-service
    Add          level ERROR

[OUTPUT]
    Name         http
    Match        payment-service
    Host         127.0.0.1
    Port         8000
    URI          /ingest/logs
    Format       json
    Json_date_key timestamp
