<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能故障诊断平台</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d2991d;
    --purple: #a371f7;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .main {
    padding: 24px 32px;
    overflow-y: auto;
    max-height: 100vh;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  h3 { font-size: 0.95rem; font-weight: 600; margin: 12px 0 6px; }
  .subtitle { color: var(--muted); font-size: 0.82rem; margin-bottom: 18px; }
  .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .logo-icon { font-size: 1.6rem; }

  /* 表单 */
  .form-group { margin-bottom: 10px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
  input, textarea, select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.85rem;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }
  .logs-textarea { min-height: 80px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.78rem; }

  /* 按钮 */
  button, .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--muted); }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .btn-danger { background: #da3633; border-color: #f85149; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 0.75rem; }

  /* 卡片 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  /* 列表项 */
  .item-list { max-height: 160px; overflow-y: auto; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-radius: 4px; font-size: 0.82rem;
    border: 1px solid transparent; margin-bottom: 3px;
    cursor: pointer;
  }
  .item:hover { background: var(--bg); border-color: var(--border); }
  .item.active { border-color: var(--accent); background: rgba(88,166,255,0.08); }
  .item-badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
    background: var(--bg); color: var(--muted);
  }
  .badge-high { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-medium { background: rgba(210,153,29,0.15); color: var(--orange); }
  .badge-low { background: rgba(139,148,158,0.15); color: var(--muted); }

  /* 进度条 */
  .progress-bar {
    height: 4px; background: var(--border); border-radius: 2px;
    margin: 8px 0; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.3s ease;
  }
  .stream-log {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.78rem; color: var(--muted);
    max-height: 180px; overflow-y: auto;
    background: var(--bg); padding: 10px; border-radius: var(--radius);
    margin: 8px 0;
  }
  .stream-log .step { color: var(--accent); }
  .stream-log .event { color: var(--green); }
  .stream-log .error { color: var(--red); }

  /* 诊断输出 */
  .diagnosis-card { border-left: 3px solid var(--accent); }
  .hypothesis {
    background: var(--bg); padding: 10px; border-radius: var(--radius);
    margin: 6px 0; border-left: 2px solid var(--purple);
  }
  .confidence-bar {
    height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px;
  }
  .confidence-fill { height: 100%; border-radius: 2px; }
  .evidence-tag {
    font-size: 0.72rem; background: rgba(88,166,255,0.1); color: var(--accent);
    padding: 2px 8px; border-radius: 4px; margin: 2px;
    display: inline-block;
  }
  .runbook-item {
    font-size: 0.8rem; padding: 6px 10px; background: var(--bg);
    border-radius: 4px; margin: 4px 0;
  }
  .score { color: var(--green); font-family: monospace; font-size: 0.75rem; }

  /* 分析链路时间线 */
  .trace-timeline { position: relative; padding-left: 20px; }
  .trace-step {
    position: relative; padding: 8px 0 8px 16px;
    border-left: 2px solid var(--border); margin-left: 6px;
  }
  .trace-step:last-child { border-left-color: transparent; }
  .trace-dot {
    position: absolute; left: -6px; top: 12px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
  }
  .trace-dot.completed { background: var(--green); }
  .trace-step-name { font-size: 0.8rem; font-weight: 600; }
  .trace-step-detail { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  /* 空状态 */
  .empty { color: var(--muted); font-size: 0.85rem; padding: 12px 0; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* 加载动画 */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="layout">

<!-- ═══════════════════════════════════════════════ 左侧栏 ═══════════════ -->
<div class="sidebar">
  <div class="logo">
    <span class="logo-icon">🛡</span>
    <div>
      <h1>AI 智能故障诊断</h1>
      <div class="subtitle">Incident Copilot Platform</div>
    </div>
  </div>

  <!-- 功能状态徽章 -->
  <div id="feature-status" style="margin-bottom:14px;font-size:0.72rem;color:var(--muted);">
    <span class="spinner" style="width:10px;height:10px;"></span> 加载功能状态...
  </div>

  <!-- 1. 创建服务 -->
  <h2>1. 注册服务</h2>
  <form id="service-form" onsubmit="createService(event)">
    <div class="form-group">
      <label>服务名称</label>
      <input id="svc-name" placeholder="例如 payment-service" required>
    </div>
    <div class="form-group">
      <label>描述（可选）</label>
      <input id="svc-desc" placeholder="处理支付请求的后端服务">
    </div>
    <button type="submit" class="btn-primary btn-sm">+ 创建服务</button>
  </form>
  <div class="item-list" id="service-list" style="margin-top: 8px;"></div>

  <!-- 2. 添加日志 -->
  <h2>2. 导入日志</h2>
  <form id="log-form" onsubmit="addLogs(event)">
    <div class="form-group">
      <label>所属服务</label>
      <select id="log-service" required><option value="">-- 请选择 --</option></select>
    </div>
    <div class="form-group">
      <label>日志内容（一行一条）</label>
      <textarea id="log-messages" class="logs-textarea" placeholder="ERROR DBConnectionTimeout while connecting to mysql-primary&#10;ERROR Payment API returned 500 after retry failed" required></textarea>
    </div>
    <button type="submit" class="btn-sm">+ 导入日志</button>
  </form>

  <!-- 3. 创建事故 -->
  <h2>3. 创建事故</h2>
  <form id="incident-form" onsubmit="createIncident(event)">
    <div class="form-group">
      <label>所属服务</label>
      <select id="incident-service" required><option value="">-- 请选择 --</option></select>
    </div>
    <div class="form-group">
      <label>事故标题</label>
      <input id="incident-title" placeholder="支付接口大量返回 500 错误" required>
    </div>
    <div class="form-group">
      <label>事故描述</label>
      <input id="incident-desc" placeholder="用户无法完成支付，支付请求全部失败">
    </div>
    <button type="submit" class="btn-accent btn-sm">+ 创建事故</button>
  </form>
  <div class="item-list" id="incident-list" style="margin-top: 8px;"></div>

  <!-- 分析按钮 -->
  <div style="margin-top: 16px;">
    <button class="btn-accent" onclick="runAnalysis()" id="analyze-btn" style="width:100%;justify-content:center;">
      ⚡ 执行分析
    </button>
    <div style="margin-top:8px;">
      <button class="btn-sm" onclick="runAnalysisStreaming()" id="stream-btn" style="width:100%;justify-content:center;">
        📡 流式分析（实时进度）
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════ 右侧主区域 ═══════════════ -->
<div class="main" id="main-content">
  <div style="max-width: 780px; margin: 0 auto;">
    <h2 style="margin-top:0;">📊 分析结果</h2>
    <div id="result-area">
      <div class="empty">请在左侧选择一个事故，然后点击「执行分析」或「流式分析」。</div>
    </div>
  </div>
</div>

</div><!-- /layout -->

<script>
// ═══════════════════════════════════════════════════════════ 状态
let state = {
  services: [],
  incidents: [],
  selectedServiceId: null,
  selectedIncidentId: null,
};

// ═══════════════════════════════════════════════════════════ 初始化
async function init() {
  await loadFeatures();
  await loadServices();
  await loadIncidents();
}
document.addEventListener('DOMContentLoaded', init);

// ═══════════════════════════════════════════════════════════ 功能状态
async function loadFeatures() {
  try {
    const f = await API('GET', '/features');
    const badges = [
      {label:'检索模式', val:f.retrieval_mode, active:f.retrieval_mode!=='tfidf'},
      {label:'重排序', val:f.cross_encoder_enabled?'已开启':'已关闭', active:f.cross_encoder_enabled},
      {label:'查询改写', val:f.query_rewriting_provider==='llm'?'LLM':'模板', active:true},
      {label:'文档切分', val:f.chunking_strategy, active:f.chunking_strategy!=='markdown'},
      {label:'ReAct Agent', val:f.react_agent_enabled?'运行中':'未启用', active:f.react_agent_enabled},
      {label:'向量库', val:f.chromadb_available?'ChromaDB':'TF-IDF', active:f.chromadb_available},
      {label:'LLM', val:f.llm_provider==='mock'?'Mock':'真实模型', active:f.llm_provider!=='mock'},
      {label:'语义模型', val:f.sentence_transformer_available?'已就绪':'不可用', active:f.sentence_transformer_available},
    ];
    document.getElementById('feature-status').innerHTML = badges.map(b =>
      `<span class="evidence-tag" style="opacity:${b.active?'1':'0.5'};background:${b.active?'rgba(63,185,80,0.15)':'rgba(139,148,158,0.08)'};color:${b.active?'var(--green)':'var(--muted)'};margin:2px;cursor:help" title="${b.label}: ${b.val}">${b.active?'':'·'}${b.label}:${b.val}</span>`
    ).join('');
  } catch(e) {
    document.getElementById('feature-status').textContent = '功能状态获取失败';
  }
}

// ═══════════════════════════════════════════════════════════ API 工具
const API = (method, path, body) =>
  fetch(path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined })
    .then(r => { if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText) }); return r.json(); });

// ═══════════════════════════════════════════════════════════ 服务管理
async function loadServices() {
  state.services = await API('GET', '/services');
  renderServices();
  updateServiceSelects();
}
function renderServices() {
  document.getElementById('service-list').innerHTML = state.services.map(s =>
    `<div class="item${state.selectedServiceId === s.id ? ' active' : ''}" onclick="selectService(${s.id})">
      <span>${esc(s.name)}</span>
      <span class="item-badge">id:${s.id}</span>
    </div>`
  ).join('') || '<div class="empty">暂无服务</div>';
}
function selectService(id) { state.selectedServiceId = id; renderServices(); }
function updateServiceSelects() {
  const html = state.services.map(s => `<option value="${s.id}">${esc(s.name)} (id:${s.id})</option>`).join('');
  document.getElementById('log-service').innerHTML = '<option value="">-- 请选择 --</option>' + html;
  document.getElementById('incident-service').innerHTML = '<option value="">-- 请选择 --</option>' + html;
}
async function createService(e) {
  e.preventDefault();
  const name = document.getElementById('svc-name').value.trim();
  const desc = document.getElementById('svc-desc').value.trim() || undefined;
  if (!name) return;
  await API('POST', '/services', { name, description: desc, owner: 'dashboard' });
  document.getElementById('svc-name').value = '';
  document.getElementById('svc-desc').value = '';
  await loadServices();
  showToast('服务创建成功');
}

// ═══════════════════════════════════════════════════════════ 日志管理
async function addLogs(e) {
  e.preventDefault();
  const serviceId = parseInt(document.getElementById('log-service').value);
  const text = document.getElementById('log-messages').value.trim();
  if (!serviceId || !text) return;
  const messages = text.split('\n').filter(m => m.trim());
  for (const msg of messages) {
    await API('POST', '/logs', {
      service_id: serviceId,
      level: msg.toLowerCase().includes('error') ? 'ERROR' : 'INFO',
      message: msg.trim()
    });
  }
  document.getElementById('log-messages').value = '';
  showToast(`已导入 ${messages.length} 条日志`);
}

// ═══════════════════════════════════════════════════════════ 事故管理
async function loadIncidents() {
  state.incidents = await API('GET', '/incidents');
  renderIncidents();
}
function renderIncidents() {
  document.getElementById('incident-list').innerHTML = state.incidents.map(inc =>
    `<div class="item${state.selectedIncidentId === inc.id ? ' active' : ''}" onclick="selectIncident(${inc.id})">
      <span>${esc(inc.title)}</span>
      <span class="item-badge">${esc(inc.status)}</span>
    </div>`
  ).join('') || '<div class="empty">暂无事故</div>';
}
function selectIncident(id) { state.selectedIncidentId = id; renderIncidents(); }
async function createIncident(e) {
  e.preventDefault();
  const serviceId = parseInt(document.getElementById('incident-service').value);
  const title = document.getElementById('incident-title').value.trim();
  const desc = document.getElementById('incident-desc').value.trim() || undefined;
  if (!serviceId || !title) return;
  await API('POST', '/incidents', { service_id: serviceId, title, description: desc });
  document.getElementById('incident-title').value = '';
  document.getElementById('incident-desc').value = '';
  await loadIncidents();
  showToast('事故创建成功');
}

// ═══════════════════════════════════════════════════════════ 标准分析
async function runAnalysis() {
  if (!state.selectedIncidentId) { alert('请先在左侧选择一个事故'); return; }
  const id = state.selectedIncidentId;
  document.getElementById('result-area').innerHTML = '<div class="empty"><span class="spinner"></span> 正在分析中...</div>';
  try {
    const result = await API('POST', `/incidents/${id}/analyze`);
    renderResult(result);
  } catch (err) {
    document.getElementById('result-area').innerHTML = `<div class="empty" style="color:var(--red)">分析失败: ${esc(err.message)}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════ SSE 流式分析
async function runAnalysisStreaming() {
  if (!state.selectedIncidentId) { alert('请先在左侧选择一个事故'); return; }
  const id = state.selectedIncidentId;
  document.getElementById('result-area').innerHTML = `
    <div class="card">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="stream-log" id="stream-log"></div>
    </div>
    <div id="stream-result"></div>
  `;
  const log = document.getElementById('stream-log');
  let resultData = { summary: '', hypotheses: [], actions: [], traces: [] };
  let progress = 0;

  try {
    const response = await fetch(`/incidents/${id}/analyze/stream`, { method: 'POST' });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) { eventType = line.slice(7); continue; }
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (eventType === 'progress') {
              log.innerHTML += `<div class="step">⬡ ${esc(data.message)}</div>`;
              progress = Math.min(progress + 15, 90);
              document.getElementById('progress-fill').style.width = progress + '%';
            } else if (eventType === 'diagnosis_chunk') {
              resultData.summary += data.text;
              document.getElementById('stream-result').innerHTML = `<div class="card diagnosis-card">
                <h3>🩺 诊断报告（实时生成中...）</h3>
                <p>${esc(resultData.summary)}</p>
              </div>`;
            } else if (eventType === 'hypothesis') {
              resultData.hypotheses.push(data);
            } else if (eventType === 'action') {
              resultData.actions.push(data.text);
            } else if (eventType === 'trace') {
              resultData.traces.push(data);
              log.innerHTML += `<div class="event">✓ ${esc(data.step_name)}: ${esc(data.detail.substring(0,80))}...</div>`;
            } else if (eventType === 'complete') {
              progress = 100;
              document.getElementById('progress-fill').style.width = '100%';
              log.innerHTML += '<div class="event">✓ 分析完成</div>';
              renderStreamResult(data, resultData);
            }
          } catch (_) {}
        }
      }
      log.scrollTop = log.scrollHeight;
    }
  } catch (err) {
    log.innerHTML += `<div class="error">✗ 流式分析中断: ${esc(err.message)}</div>`;
  }
}

function renderStreamResult(meta, collected) {
  const conf = (c) => {
    if (c >= 0.7) return 'var(--green)';
    if (c >= 0.4) return 'var(--orange)';
    return 'var(--red)';
  };
  const lbl = (v) => ({high:'高',medium:'中',low:'低'}[v]||v);
  document.getElementById('stream-result').innerHTML = `
    <div class="card diagnosis-card">
      <h3>🩺 诊断结果</h3>
      <p><strong>故障类型：</strong><span class="badge-${meta.severity==='high'?'high':(meta.severity==='medium'?'medium':'low')}">${esc(meta.issue_type)}</span></p>
      <p><strong>严重程度：</strong>${lbl(meta.severity)}</p>
      <p style="margin-top:8px;">${esc(collected.summary)}</p>
      ${collected.hypotheses.map((h,i) => `
        <div class="hypothesis">
          <strong>假设 ${i+1}：</strong>${esc(h.cause)}
          <div class="confidence-bar"><div class="confidence-fill" style="width:${(h.confidence*100).toFixed(0)}%;background:${conf(h.confidence)}"></div></div>
          <span style="font-size:0.75rem;color:var(--muted)">置信度: ${(h.confidence*100).toFixed(0)}%</span>
        </div>
      `).join('')}
      ${collected.actions.length ? `<h3>建议操作</h3><ul>${collected.actions.map(a => `<li style="font-size:0.85rem">${esc(a)}</li>`).join('')}</ul>` : ''}
      <p style="margin-top:8px;"><strong>影响范围：</strong>${esc(meta.impact_scope)}</p>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:4px;">
        检索到排障手册：${meta.runbook_count} 份 · 相似历史事故：${meta.similar_incident_count} 例
      </p>
    </div>
    ${collected.traces.length ? `
      <div class="card">
        <h3>🔍 分析链路</h3>
        <div class="trace-timeline">
          ${collected.traces.map(t => `
            <div class="trace-step">
              <div class="trace-dot completed"></div>
              <div class="trace-step-name">${esc(t.step_name)}</div>
              <div class="trace-step-detail">${esc(t.detail)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

// ═══════════════════════════════════════════════════════════ 渲染标准分析结果
function renderResult(r) {
  const confColor = (c) => c >= 0.7 ? 'var(--green)' : c >= 0.4 ? 'var(--orange)' : 'var(--red)';
  const sevLabel = {high:'高',medium:'中',low:'低'};
  document.getElementById('result-area').innerHTML = `
    <div class="card diagnosis-card">
      <div class="card-header">
        <h3 style="margin:0;">🩺 诊断结果</h3>
        <span class="badge-${r.severity==='high'?'high':(r.severity==='medium'?'medium':'low')}">${sevLabel[r.severity]||r.severity} 严重度</span>
      </div>
      <p><strong>故障类型：</strong>${esc(r.issue_type)}</p>
      <p style="margin-top:4px;">${esc(r.diagnosis_summary)}</p>
      ${(r.root_cause_hypotheses||[]).map((h,i) => `
        <div class="hypothesis">
          <strong>根因假设 ${i+1}：</strong>${esc(h.cause)}
          <div class="confidence-bar"><div class="confidence-fill" style="width:${(h.confidence*100).toFixed(0)}%;background:${confColor(h.confidence)}"></div></div>
          <span style="font-size:0.75rem;color:var(--muted)">置信度: ${(h.confidence*100).toFixed(0)}%</span>
          <div style="margin-top:4px;">${(h.supporting_evidence||[]).map(e => `<span class="evidence-tag">📎 ${esc(e)}</span>`).join(' ')}</div>
        </div>
      `).join('')}
      <p style="margin-top:8px;"><strong>影响范围：</strong>${esc(r.impact_scope)}</p>
    </div>
    <div class="card">
      <h3>📋 建议操作</h3>
      <ul>${(r.structured_suggested_actions||[r.suggested_actions]).map(a => `<li style="font-size:0.85rem">${esc(a)}</li>`).join('')}</ul>
    </div>
    ${(r.retrieved_runbook_chunks||[]).length ? `
      <div class="card">
        <h3>📚 检索到的排障手册</h3>
        ${r.retrieved_runbook_chunks.map(c => `
          <div class="runbook-item">
            <strong>${esc(c.source)}</strong> / ${esc(c.title)}
            <span class="score">相关度: ${c.score.toFixed(4)}</span>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${esc(c.content.substring(0,200))}...</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${(r.similar_incidents||[]).length ? `
      <div class="card">
        <h3>🔄 相似历史事故</h3>
        ${r.similar_incidents.map(inc => `
          <div class="runbook-item">
            <strong>${esc(inc.title)}</strong> <span class="score">相似度: ${inc.similarity_score.toFixed(4)}</span>
            <div style="font-size:0.78rem;color:var(--muted)">根因: ${esc(inc.root_cause)}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    <div class="card">
      <h3>🗺 分析计划</h3>
      <p style="font-size:0.82rem;color:var(--muted)">${esc(r.analysis_plan?.analysis_plan||'')}</p>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">
        ${(r.analysis_plan?.tool_steps||[]).map(s => `<span class="evidence-tag">🔧 ${esc(s)}</span>`).join('')}
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════ 工具函数
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:0.82rem;z-index:999;animation:fadeOut 2.2s forwards';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
</script>
<style>
  @keyframes fadeOut { 0%,70% { opacity:1 } 100% { opacity:0 } }
</style>
</body>
</html>
